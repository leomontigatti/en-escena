# AFK — Review. Spec §4.4.
#
# PR labeled `agent:review` → review runner improves the code + emits a review
# payload → orchestrator pushes any improvement commit (race-safe), posts one
# review (event: COMMENT, never APPROVE), replies to unresolved threads, and
# marks the PR ready. Hands back to a human — no automatic chaining.
#
# `pull_request_target` (not `pull_request`): the labeled event must fire even
# when the PR is out-of-date/conflicting, which has no test-merge commit (§3.3).

name: AFK Review

on:
  pull_request_target:
    types: [labeled]

concurrency:
  # Shared with Implement PR + Update Branch when this run will actually mutate
  # the branch: all three push to the PR branch, so they serialise (§3.5). A
  # single `labeled` event starts all three workflows; the two whose label
  # doesn't match are no-ops. If those no-ops also joined the shared group they
  # would cancel the pending real run (#383), so a no-op takes a unique per-run
  # group instead and contends with nobody.
  group: ${{ github.event.label.name == 'agent:review' && format('agent-mutate-pr-{0}', github.event.pull_request.number) || format('agent-mutate-pr-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    # Same-repo guard (#635). `pull_request_target` runs with this repo's secrets,
    # and the checkout below puts `head.sha` — the PR author's tree — on disk. On a
    # fork PR that is contributor-controlled code executing with `AGENT_PAT` in
    # reach. The label is a permission gate, not a provenance check, so it has to
    # be paired with one. It belongs at job level: a step-level refusal would run
    # after the checkout it is meant to prevent.
    if: >-
      github.event.label.name == 'agent:review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # --- Preflight: refuse before the label transition and the installs (#790). ---
      - name: Preflight (refusals)
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"

          pr=$(gh pr view "$PR_NUMBER" --json state,body)
          state=$(jq -r '.state' <<< "$pr")
          if [ "$state" != "OPEN" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:review"
            gh pr comment "$PR_NUMBER" --body "\`agent:review\` ignored: the PR is not open (state: $state)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No linked issue means the Spec axis has no spec to check the diff
          # against — half the review. Refusing here costs nothing; letting the
          # run start costs the checkout, the installs and an `agent:blocked`
          # label for a human to clear (#790).
          if ! jq -re '(.body // "") | test("(closes|fixes|resolves)\\s+#[0-9]+"; "i")' <<< "$pr" > /dev/null; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:review"
            gh pr comment "$PR_NUMBER" --body "\`agent:review\` ignored: the PR body links no issue (closes/fixes/resolves #N), so the Spec axis has nothing to check against."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition to in-progress
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" \
            --remove-label "agent:review" \
            --remove-label "agent:blocked" \
            --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || github.token }}

      - name: Prepare branch refs
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin master:master
          # Point the local branch at the checked-out head sha so the race-safe
          # push has a named branch to lease against.
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"

      - name: Setup pnpm
        if: steps.preflight.outputs.proceed == 'true'
        uses: pnpm/action-setup@v5
      - name: Setup Node
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps + agent runner
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          pnpm install --frozen-lockfile
          npm install -g @anthropic-ai/claude-code

      # The `code-review` skill the review prompt delegates its analysis to.
      # Installed globally (~/.claude/skills), deliberately outside the git work
      # tree so the runner's commit step can never sweep it into the PR branch.
      # Tracked at `latest` on purpose — the skill is Matt Pocock's managed
      # bundle and every run exercises its current version. Scoped to the
      # claude-code agent so the step exits 0.
      - name: Install code-review skill
        if: steps.preflight.outputs.proceed == 'true'
        run: npx --yes skills@latest add mattpocock/skills -g -s code-review -a claude-code -y --copy

      - name: Configure git identity
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

      - name: Run review runner
        if: steps.preflight.outputs.proceed == 'true'
        # 45, not the 30 the other runners use: the `code-review` skill fans out
        # into parallel sub-agents, and the agent now reads the diff per-file
        # instead of being handed it. Review runs measured 5-9 min end to end
        # before that, with a ~20 min tail already brushing the old budget.
        timeout-minutes: 45 # guardrail: an agent hang must not burn the whole run
        env:
          # Read-only prefetch (`gh`) uses this. The runner calls
          # `revokeGitHubToken()` once the prefetch is done, so the agent itself
          # never sees it — `noSandbox()` would otherwise spread it into the
          # agent's environment (§3.9: the agent never mutates the tracker).
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Internal deadline, below the step's `timeout-minutes`: the runner aborts
          # the agent and fails with a real reason instead of Actions killing it
          # with no `failure_reason.txt` (#512).
          AGENT_BUDGET_MINUTES: 40
        run: pnpm exec tsx .sandcastle/agent-review/review.mts

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-agent-log
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Race-safe push (if the agent committed)
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "$BRANCH_HEAD_SHA" ]; then
            echo "No new commit; nothing to push."
            exit 0
          fi
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt || true
          if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
            echo "Branch advanced during review run." > "$OUTPUT_DIR/failure_reason.txt"
            exit 1
          fi

      - name: Post review
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --input "$OUTPUT_DIR/review_payload.json"

      - name: Mark PR ready
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "$PR_NUMBER"

      - name: Post thread replies
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          replies="$OUTPUT_DIR/replies.json"
          [ -s "$replies" ] || { echo "No replies."; exit 0; }
          count=$(jq 'length' "$replies")
          for i in $(seq 0 $((count - 1))); do
            node_id=$(jq -r ".[$i].commentId" "$replies")
            body=$(jq -r ".[$i].body" "$replies")
            rest_id=$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){... on PullRequestReviewComment{databaseId}}}' \
              -F id="$node_id" --jq '.data.node.databaseId')
            [ -n "$rest_id" ] || { echo "Skipping reply with unresolvable id $node_id"; continue; }
            gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/comments/$rest_id/replies" -f body="$body"
          done

      # `!= 'false'`, not `== 'true'`: a preflight that *itself* fails leaves
      # `proceed` unset, and `== 'true'` would swallow that — a red run with no
      # `agent:blocked` and no comment, which is the one failure mode this
      # workflow must never have. Only a deliberate refusal (`false`) is silent.
      - name: On failure — block + comment
        if: failure() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — before the label below
            # gets added. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked"
          gh pr comment "$PR_NUMBER" --body "$(printf '`agent:review` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s/%s/actions/runs/%s\n\nRe-add `agent:review` to retry.' "$reason" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")"

      - name: Always — remove in-progress
        if: always() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
