# AFK — Update Branch. Spec §4.6.
#
# PR labeled `agent:update-branch` → the runner script does the deterministic
# merge of the base into the branch itself; the agent is invoked ONLY when that
# merge conflicts → orchestrator pushes the result (race-safe), posts a comment
# describing the merge, and typechecks the merged tree to catch conflicts git
# resolved cleanly but the compiler doesn't accept. Hands back to a human — no
# automatic chaining.
#
# `pull_request_target` (not `pull_request`): the labeled event must fire even
# when the PR is out-of-date/conflicting — which is exactly when this runs (§3.3).

name: AFK Update Branch

on:
  pull_request_target:
    types: [labeled]

concurrency:
  # Shared with Review + Implement PR when this run will actually mutate the
  # branch: all three push to the PR branch, so they serialise (§3.5). A single
  # `labeled` event starts all three workflows; the two whose label doesn't
  # match are no-ops. If those no-ops also joined the shared group they would
  # cancel the pending real run (#383), so a no-op takes a unique per-run group
  # instead and contends with nobody.
  group: ${{ github.event.label.name == 'agent:update-branch' && format('agent-mutate-pr-{0}', github.event.pull_request.number) || format('agent-mutate-pr-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-branch:
    if: github.event.label.name == 'agent:update-branch'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Transition to in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"
          gh pr edit "$PR_NUMBER" \
            --remove-label "agent:update-branch" \
            --remove-label "agent:blocked" \
            --add-label "agent:in-progress"

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || github.token }}

      - name: Prepare branch refs
        run: |
          set -euo pipefail
          # Point the local branch at the checked-out head sha so the race-safe
          # push has a named branch to lease against. The runner fetches the base.
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps + agent runner
        run: |
          pnpm install --frozen-lockfile
          npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

      - name: Run update-branch runner
        timeout-minutes: 30 # guardrail: an agent hang must not burn the whole run
        env:
          # Read-only prefetch (`gh pr view`) uses this; the agent holds no token.
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Internal deadline, below the step's `timeout-minutes`: the runner aborts
          # the agent and fails with a real reason instead of being killed without
          # leaving one (#512).
          AGENT_BUDGET_MINUTES: 25
        run: pnpm exec tsx .sandcastle/agent-update-branch/update-branch.mts

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-branch-agent-log
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Race-safe push (if the merge produced anything)
        run: |
          set -euo pipefail
          [ "$(cat "$OUTPUT_DIR/should_push.txt" 2>/dev/null || echo false)" = "true" ] || {
            echo "Nothing to push (already up to date)."
            exit 0
          }
          # The lease tolerates the rewritten history of a merge commit as long as
          # the remote head is unchanged (§3.6).
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt || true
          if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
            echo "Branch advanced during update-branch run." > "$OUTPUT_DIR/failure_reason.txt"
            exit 1
          fi

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment="$OUTPUT_DIR/comment.md"
          [ -s "$comment" ] || { echo "No comment to post."; exit 0; }
          gh pr comment "$PR_NUMBER" --body-file "$comment"

      # --- Semantic-conflict gate. A textually clean merge can still be broken:
      # the base renames or reshapes something the branch calls, git merges both
      # sides without a conflict marker, and nothing compiles the result. That is
      # how #567 shipped a red branch — the base flattened a reader's parameter
      # while the branch added a caller using the old shape, in a different file.
      # The clean-merge path never invokes the agent (update-branch.mts), so the
      # `pnpm typecheck` its prompt asks for only ever runs on the conflict path.
      #
      # Runs AFTER the push and the merge comment on purpose: the merge itself is
      # correct work and must not be lost, and CI will run on the pushed head
      # anyway. Failing here only flips the PR to `agent:blocked` with a reason,
      # so a human sees the semantic conflict named instead of a bare CI red.
      - name: Typecheck the merged tree
        run: |
          set -euo pipefail
          [ "$(cat "$OUTPUT_DIR/should_push.txt" 2>/dev/null || echo false)" = "true" ] || {
            echo "Nothing was merged; nothing to typecheck."
            exit 0
          }
          if ! pnpm typecheck > typecheck.log 2>&1; then
            {
              printf 'The merge applied cleanly but the merged tree does not typecheck — a semantic conflict between `%s` and this branch (a rename or signature change on one side, a caller on the other). The merge WAS pushed; fix the fallout on top of it.\n\n```\n' "$BASE_REF"
              # Strip ANSI: the tail is quoted into a PR comment, not a terminal.
              tail -40 typecheck.log | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g'
              printf '\n```\n'
            } > "$OUTPUT_DIR/failure_reason.txt"
            exit 1
          fi

      - name: On failure — block + comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — before the label below
            # gets added. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked"
          gh pr comment "$PR_NUMBER" --body "$(printf '`agent:update-branch` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s/%s/actions/runs/%s\n\nRe-add `agent:update-branch` to retry.' "$reason" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")"

      - name: Always — remove in-progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
