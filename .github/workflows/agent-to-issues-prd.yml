# AFK — To Issues (PRD decomposition). Spec §4.1.
#
# issue labeled `agent:to-issues` → the to-issues agent drafts a flat, ordered
# list of tracer-bullet slices → the orchestrator creates each as a native
# sub-issue and attaches it to the PRD. No automatic chaining: a human reviews
# the sub-issues, then labels the PRD `agent:implement`.
#
# The orchestrator (this workflow) owns every tracker mutation; the runner holds
# no GitHub token (spec §3.9).

name: AFK To Issues

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-to-issues-prd-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  to-issues:
    if: github.event.label.name == 'agent:to-issues'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      # --- Preflight: compute shape and refuse per §4.1. ---
      - name: Preflight (shape + refusals)
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"

          sub_count=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" --jq 'length' 2>/dev/null || echo 0)
          parent=$(gh api graphql -f query='
            query ($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } }
            }' -F owner="${GH_REPO%/*}" -F repo="${GH_REPO#*/}" -F num="$ISSUE_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")

          if [ "${sub_count:-0}" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" --add-label "agent:blocked"
            gh issue comment "$ISSUE_NUMBER" --body "Already has $sub_count sub-issue(s); detach them first before re-labelling \`agent:to-issues\`."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$parent" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:to-issues" --add-label "agent:blocked"
            gh issue comment "$ISSUE_NUMBER" --body "Nested PRDs are not supported; flatten this into a top-level PRD (it is currently a sub-issue of #$parent)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition to in-progress
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "agent:to-issues" \
            --remove-label "agent:blocked" \
            --add-label "agent:in-progress"

      # Prefetch the PRD body (§3.8): the runner has no GitHub token, so the
      # agent gets the PRD text from here, never via `gh`. Random heredoc
      # delimiter so a crafted body line can't break out of GITHUB_ENV.
      - name: Capture PRD body
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delim="PRD_BODY_EOF_$(openssl rand -hex 12)"
          {
            echo "PRD_BODY<<$delim"
            gh issue view "$ISSUE_NUMBER" --json body --jq '.body'
            echo "$delim"
          } >> "$GITHUB_ENV"

      - name: Checkout master
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        if: steps.preflight.outputs.proceed == 'true'
        # The pnpm version comes from the `packageManager` field (pnpm 11.9.0)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install deps + agent runner
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          pnpm install --frozen-lockfile
          # `--allow-build`: without it pnpm reports success but skips the CLI's
          # postinstall, and `claude` then fails at run time with "native binary not
          # installed". `--version` is the guard that turns that into an install-time
          # failure, and it logs the resolved `stable` version for the run.
          #
          # `--global-bin-dir "$PNPM_HOME"`: `pnpm/action-setup` puts `$PNPM_HOME` on
          # PATH but not pnpm's default global bin dir (`$PNPM_HOME/bin`), and pnpm
          # refuses a global add whose bin dir is not on PATH — a bare `pnpm add -g`
          # exits 1 here with "The configured global bin directory ... is not in PATH".
          # Installing into `$PNPM_HOME` itself is what puts `claude` on PATH for this
          # step *and* for the later runner step, which spawns a bare `claude`.
          if [ -z "${PNPM_HOME-}" ]; then
            echo "PNPM_HOME is unset: pnpm/action-setup must run before this step." >&2
            exit 1
          fi
          pnpm add -g --global-bin-dir "$PNPM_HOME" --allow-build=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
          claude --version

      - name: Run to-issues runner
        if: steps.preflight.outputs.proceed == 'true'
        timeout-minutes: 30 # guardrail: an agent hang must not burn the whole run
        env:
          # No GH_TOKEN: the runner is token-less (§3.9); PRD_BODY is prefetched.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PRD_NUMBER: ${{ github.event.issue.number }}
          PRD_TITLE: ${{ github.event.issue.title }}
          # Internal deadline, below the step's `timeout-minutes`: the runner aborts
          # the agent and fails with a real reason instead of being killed without
          # leaving one (#512).
          AGENT_BUDGET_MINUTES: 25
        run: pnpm exec tsx .sandcastle/agent-to-issues/to-issues.mts

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: to-issues-agent-log
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      # --- Create + attach each slice as a native sub-issue, in order (§4.1). ---
      - name: Create and attach sub-issues
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          slices="$OUTPUT_DIR/slices.json"
          if [ ! -s "$slices" ]; then
            echo "to-issues runner produced no slices.json." > "$OUTPUT_DIR/failure_reason.txt"
            exit 1
          fi
          count=$(jq '.slices | length' "$slices")
          if [ "$count" -eq 0 ]; then
            echo "to-issues runner produced zero slices." > "$OUTPUT_DIR/failure_reason.txt"
            exit 1
          fi
          for i in $(seq 0 $((count - 1))); do
            title=$(jq -r ".slices[$i].title" "$slices")
            what=$(jq -r ".slices[$i].whatToBuild" "$slices")
            criteria=$(jq -r ".slices[$i].acceptanceCriteria[] | \"- [ ] \" + ." "$slices")
            body=$(printf '## Parent PRD\n\n#%s\n\n## What to build\n\n%s\n\n## Acceptance criteria\n\n%s\n' \
              "$ISSUE_NUMBER" "$what" "$criteria")
            url=$(gh issue create --title "$title" --body "$body")
            sub_number=$(basename "$url")
            sub_id=$(gh api "repos/$GH_REPO/issues/$sub_number" --jq .id)
            gh api -X POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" -F "sub_issue_id=$sub_id" >/dev/null
            echo "Created and attached sub-issue #$sub_number: $title"
          done

      # --- Failure: mark blocked + comment, listing sub-issues already created (§4.1). ---
      # `!= 'false'`, not `== 'true'`: a preflight that *itself* fails leaves
      # `proceed` unset, and `== 'true'` would swallow that — a red run with no
      # `agent:blocked` and no comment. Only a deliberate refusal (`false`) is silent.
      - name: On failure — block + comment
        if: failure() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — before the label below
            # gets added. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          created=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" --jq '[.[]|"#\(.number)"]|join(", ")' 2>/dev/null || echo "")
          [ -n "$created" ] || created="(none)"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked"
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '`agent:to-issues` run failed.\n\n**Reason:** %s\n\n**Sub-issues already created (clean up if needed):** %s\n\n**Workflow run:** %s/%s/actions/runs/%s\n\nRe-add `agent:to-issues` to retry.' "$reason" "$created" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")"

      - name: Always — remove in-progress
        if: always() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
