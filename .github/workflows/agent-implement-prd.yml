# AFK — Implement PRD (chain of sub-issues). Spec §4.3.
#
# PRD issue labeled `agent:implement` **with** sub-issues → implement the first
# not-yet-implemented sub-issue on one shared branch → push (plain, never force)
# → mark that sub-issue implemented (a comment, not a close) → open/reuse one
# draft PR that carries `Closes #<sub>` for every sub-issue → re-label the PRD to
# run the next sub-issue (the chain), or hand off to Review once all are marked.
#
# Sub-issues are NOT closed here (divergence from spec §4.3 step 7, recorded in
# docs/agents/afk-vendored-assets.md). At this point the work sits on a shared
# branch that may never merge, so closing would assert `COMPLETED` — "built" —
# about something that is not on `master`; see docs/agents/issue-tracker.md →
# "Closing an issue". The PR's `Closes #<sub>` closes them when it merges, which
# is when the claim becomes true. Chain progress therefore reads the
# `IMPLEMENTED_MARKER` comment instead of the issue's state.
#
# Shares the `agent:implement` trigger with Implement (single); each preflight
# decides ownership by shape — single silent-skips PRDs, this silent-skips
# non-PRDs. The orchestrator owns every mutation; the runner holds no GitHub
# token (spec §3.9).

name: AFK Implement PRD

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-implement-prd-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement-prd:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      # Written by this workflow onto a sub-issue once its run pushed. It is what
      # "already done" means now that the run no longer closes the sub-issue.
      IMPLEMENTED_MARKER: "<!-- afk:implemented -->"
    steps:
      # --- Preflight: richer shape (sub-issues + parent + per-child shape), §4.3. ---
      - name: Preflight (shape + refusals)
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"

          subs=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" 2>/dev/null || echo '[]')
          sub_count=$(echo "$subs" | jq 'length')

          if [ "$sub_count" -eq 0 ]; then
            echo "Issue #$ISSUE_NUMBER has no sub-issues; Implement (single) owns this trigger. Silent skip."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent=$(gh api graphql -f query='
            query ($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } }
            }' -F owner="${GH_REPO%/*}" -F repo="${GH_REPO#*/}" -F num="$ISSUE_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")

          if [ -n "$parent" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" --add-label "agent:blocked"
            gh issue comment "$ISSUE_NUMBER" --body "This PRD is itself a sub-issue of #$parent; nested PRDs are not supported — flatten it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nested=$(echo "$subs" | jq -r '[.[] | select((.sub_issues_summary.total // 0) > 0)] | .[0].number // empty')
          if [ -n "$nested" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" --add-label "agent:blocked"
            gh issue comment "$ISSUE_NUMBER" --body "Sub-issue #$nested has its own sub-issues; nested children are not supported — flatten it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pending = still-open sub-issues that no earlier run has implemented.
          # "Open" alone no longer means "not done": the run marks a sub-issue with
          # a comment and leaves it open for the PR to close on merge (see the
          # header). The marker is what advances the chain.
          # (`case`, not a `grep` pipeline: with `pipefail` a `grep -q` that exits
          # on the first match SIGPIPEs `gh` and the pipeline reports 141 — a hit
          # would read as a miss.)
          pending=$(echo "$subs" | jq -r '.[] | select(.state == "open") | .number' \
            | while read -r n; do
                bodies=$(gh issue view "$n" --json comments --jq '.comments[].body')
                case "$bodies" in
                  *"$IMPLEMENTED_MARKER"*) continue ;;
                esac
                echo "$n"
              done)

          if [ -z "$pending" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" --add-label "agent:blocked"
            gh issue comment "$ISSUE_NUMBER" --body "Every sub-issue is already implemented (or closed); nothing to implement. They close when the PR merges."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # target = first pending sub-issue, in sub-issue API (position) order.
          sub_number=$(echo "$pending" | head -1)
          target=$(echo "$subs" | jq --argjson n "$sub_number" '.[] | select(.number == $n)')
          sub_title=$(echo "$target" | jq -r '.title')
          echo "sub_number=$sub_number" >> "$GITHUB_OUTPUT"
          echo "SUB_ISSUE_NUMBER=$sub_number" >> "$GITHUB_ENV"
          {
            echo "SUB_ISSUE_TITLE<<SUB_TITLE_EOF"
            echo "$sub_title"
            echo "SUB_TITLE_EOF"
          } >> "$GITHUB_ENV"

          # Siblings: rendered list for the agent's context.
          siblings=$(echo "$subs" | jq -r '.[] | "- #\(.number) — \(.title) (\(.state))"')
          {
            echo "SIBLINGS<<SIBLINGS_EOF"
            echo "$siblings"
            echo "SIBLINGS_EOF"
          } >> "$GITHUB_ENV"

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition PRD to in-progress
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "agent:implement" \
            --remove-label "agent:blocked" \
            --add-label "agent:in-progress"

      # Prefetch PRD + target sub-issue bodies (§3.8): the runner is token-less.
      - name: Capture PRD and sub-issue bodies
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUB_NUMBER: ${{ steps.preflight.outputs.sub_number }}
        run: |
          set -euo pipefail
          pdelim="PRD_BODY_EOF_$(openssl rand -hex 12)"
          {
            echo "PRD_BODY<<$pdelim"
            gh issue view "$ISSUE_NUMBER" --json body --jq '.body'
            echo "$pdelim"
          } >> "$GITHUB_ENV"
          sdelim="SUB_BODY_EOF_$(openssl rand -hex 12)"
          {
            echo "SUB_ISSUE_BODY<<$sdelim"
            gh issue view "$SUB_NUMBER" --json body --jq '.body'
            echo "$sdelim"
          } >> "$GITHUB_ENV"

      - name: Checkout master
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          # No credential in `.git/config`: the agent session reads issue text and
          # runs `pnpm install` scripts, so nothing it can reach may hold a token
          # (#956). The push steps authenticate per command instead.
          persist-credentials: false

      # Snapshot the label script from `master`, before the agent session exists.
      # The chaining step at the end of the job carries `AGENT_PAT`, and by then
      # the session has had write access to the tree and the job sits on an
      # unreviewed `agent/` branch — so running `scripts/afk-add-label.sh` from
      # the tree there would hand the session's own version a `repo`+`workflow`
      # PAT in the same run. That is the exposure #956 exists to rule out
      # (docs/agents/afk-setup.md → "Where the PAT is during a run"); the inline
      # block this script replaced came from `master` and could not be changed
      # mid-run, so the extraction has to keep that property.
      #
      # The digest goes to a step output, which is the one place the session
      # cannot write: the copy itself lives in `$RUNNER_TEMP`, which an
      # unsandboxed session can reach, so a copy on its own would prove nothing.
      - name: Snapshot the label script
        id: label_script
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          cp scripts/afk-add-label.sh "$RUNNER_TEMP/afk-add-label.sh"
          chmod +x "$RUNNER_TEMP/afk-add-label.sh"
          echo "digest=$(sha256sum scripts/afk-add-label.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Compute branch and resume-or-create it
        id: branch
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-50 | sed -E 's/-+$//')
          branch="agent/prd-${ISSUE_NUMBER}-${slug}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Anonymous: the checkout persisted no credential (#956), and this
          # repo is public, so reading `origin` needs none. Ask the remote
          # whether the branch exists instead of fetching and swallowing the
          # error: a fetch that fails for any other reason (network, a repo
          # gone private) must fail the run, not restart the PRD from master
          # as if the shared branch had never existed.
          exists=0
          git ls-remote --exit-code --heads origin "$branch" >/dev/null || exists=$?
          case "$exists" in
            0)
              # Resume: the branch accumulates commits across sub-issue runs.
              git fetch origin "$branch"
              git checkout -B "$branch" "origin/$branch"
              ;;
            2) git checkout -b "$branch" ;;
            *)
              echo "Could not read origin to look for $branch (exit $exists)." >&2
              exit "$exists"
              ;;
          esac

      - name: Setup pnpm
        if: steps.preflight.outputs.proceed == 'true'
        # The pnpm version comes from the `packageManager` field (pnpm 11.9.0)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install deps + agent runner
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          pnpm install --frozen-lockfile
          # `--allow-build`: without it pnpm reports success but skips the CLI's
          # postinstall, and `claude` then fails at run time with "native binary not
          # installed". `--version` is the guard that turns that into an install-time
          # failure, and it logs the resolved `stable` version for the run.
          #
          # `--global-bin-dir "$PNPM_HOME"`: `pnpm/action-setup` puts `$PNPM_HOME` on
          # PATH but not pnpm's default global bin dir (`$PNPM_HOME/bin`), and pnpm
          # refuses a global add whose bin dir is not on PATH — a bare `pnpm add -g`
          # exits 1 here with "The configured global bin directory ... is not in PATH".
          # Installing into `$PNPM_HOME` itself is what puts `claude` on PATH for this
          # step *and* for the later runner step, which spawns a bare `claude`.
          if [ -z "${PNPM_HOME-}" ]; then
            echo "PNPM_HOME is unset: pnpm/action-setup must run before this step." >&2
            exit 1
          fi
          pnpm add -g --global-bin-dir "$PNPM_HOME" --allow-build=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
          claude --version

      - name: Configure git identity
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          # The agent session starts after this step: nothing may have stored a
          # credential in the tree (#956). `persist-credentials: false` on the
          # checkout is what makes this hold; the assertion keeps it honest.
          if git config --get-all http.https://github.com/.extraheader >/dev/null; then
            echo "A credential is persisted in .git/config; refusing to start the agent." >&2
            exit 1
          fi

      - name: Run implement-prd runner
        if: steps.preflight.outputs.proceed == 'true'
        timeout-minutes: 60 # guardrail: an agent hang must not burn the whole run
        env:
          # No GH_TOKEN: the runner is token-less (§3.9); bodies are prefetched.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PRD_NUMBER: ${{ github.event.issue.number }}
          PRD_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          # Internal deadline, below the step's `timeout-minutes`: the runner aborts
          # the agent and fails with a real reason instead of being killed without
          # leaving one (#512).
          # 50, not the usual 25: implementing a PRD slice regularly outgrows 25 min
          # (run 34715632348). See docs/agents/afk-setup.md.
          AGENT_BUDGET_MINUTES: 50
        run: pnpm exec tsx .sandcastle/agent-implement-prd/implement-prd.mts

      # --- On runner failure (e.g. the runner timeout): bank the green commits
      # the agent added this run to the shared branch, so a timeout doesn't
      # discard the in-flight sub-issue's progress. Plain push (never force) —
      # it only appends to the accumulating branch. Because the branch RESUMES,
      # a retry of the same sub-issue continues from this partial progress
      # instead of redoing it. Surfaced in the failure comment below. ---
      - name: Bank partial work on runner failure
        if: failure() && steps.preflight.outputs.proceed != 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          # Explicit push credential, `AGENT_PAT` first so pushes that touch
          # `.github/workflows/**` carry the `workflow` scope, `github.token`
          # as the no-PAT fallback (docs/agents/afk-setup.md).
          PUSH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
        run: |
          set -euo pipefail
          # A crashed preflight (not a refusal) reaches here with no checkout on
          # disk — the checkout step is gated on `proceed == 'true'`. There is
          # nothing to bank, and `git` here would only add a second red step on
          # top of the real failure.
          if [ ! -e .git ]; then
            echo "No checkout — nothing to bank."
            exit 0
          fi
          # Commits added this run sit on top of the branch's prior remote state
          # (origin/$BRANCH on resume; a fresh first sub-issue has none → master).
          base="origin/$BRANCH"
          git rev-parse --verify "$base" >/dev/null 2>&1 || base="master"
          new=$(git rev-list --count "$base..HEAD")
          if [ "$new" -eq 0 ]; then
            echo "No new commits to bank."
            exit 0
          fi
          # Per-command auth (#956): the checkout persisted nothing, so this is the
          # one place a push credential exists — and only for this command.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          # `actions/checkout` masks the header it builds; this one is ours to mask.
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$BRANCH"
          echo "Banked $new new commit(s) to $BRANCH."
          echo "BANKED_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # No commit assertion (§4.3): zero new commits is legitimate if the
      # sub-issue was already satisfied by earlier work on the branch.
      - name: Push branch (plain, never force)
        if: steps.preflight.outputs.proceed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          # Explicit push credential, `AGENT_PAT` first so pushes that touch
          # `.github/workflows/**` carry the `workflow` scope, `github.token`
          # as the no-PAT fallback (docs/agents/afk-setup.md).
          PUSH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
        run: |
          set -euo pipefail
          # Per-command auth (#956): the checkout persisted nothing, so this is the
          # one place a push credential exists — and only for this command.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          # `actions/checkout` masks the header it builds; this one is ours to mask.
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$BRANCH"

      # Mark, do not close: the commit is on the shared branch, not on `master`.
      # The comment keeps the sub-issue → commit trail and is what the next run
      # (and the chain check below) reads to know this one is done.
      - name: Mark the sub-issue implemented
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUB_NUMBER: ${{ steps.preflight.outputs.sub_number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          body=$(printf 'Implemented in %s on `%s`. Part of #%s.\n\nLeft open on purpose: the PR closes it on merge, so `COMPLETED` only ever means it is on `master`.\n\n%s' \
            "$sha" "$BRANCH" "$ISSUE_NUMBER" "$IMPLEMENTED_MARKER")
          gh issue comment "$SUB_NUMBER" --body "$body"

      - name: Look up existing PR for the branch
        id: existing_pr
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Prefetch the whole sub-issue list for the PR description (only if we'll write one).
      - name: Capture sub-issue list for PR
        if: steps.preflight.outputs.proceed == 'true' && steps.existing_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subs=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" --jq '.[] | "- #\(.number) — \(.title)"')
          {
            echo "SUB_ISSUES<<SUB_ISSUES_EOF"
            echo "$subs"
            echo "SUB_ISSUES_EOF"
          } >> "$GITHUB_ENV"
          # One `Closes` per sub-issue, appended to the description by the
          # orchestrator rather than left to the agent: this is the only thing
          # that closes the sub-issues now that the run does not, so it cannot
          # depend on a model remembering it. The PRD's own `Closes` comes from
          # the runner's output schema.
          closes=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" --jq '.[] | "Closes #\(.number)"')
          {
            echo "SUB_CLOSES<<SUB_CLOSES_EOF"
            echo "$closes"
            echo "SUB_CLOSES_EOF"
          } >> "$GITHUB_ENV"

      - name: Run write-prd-pr runner
        if: steps.preflight.outputs.proceed == 'true' && steps.existing_pr.outputs.number == ''
        # With no ceiling, a hang here ate the job default (6 h). This runner is a
        # single pass (`maxIterations: 1`) with no side effects — it only drafts a
        # title and a description — so 10 min is generous.
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PRD_NUMBER: ${{ github.event.issue.number }}
          PRD_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          AGENT_BUDGET_MINUTES: 8
        run: pnpm exec tsx .sandcastle/agent-write-prd-pr/write-prd-pr.mts

      # After the job's last runner, so the artifact covers the write-prd-pr log
      # too. `always()`: if the implement-prd runner failed, this step still runs
      # and uploads whatever exists.
      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: implement-prd-agent-logs
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Open draft PR
        id: new_pr
        if: steps.preflight.outputs.proceed == 'true' && steps.existing_pr.outputs.number == ''
        env:
          # AGENT_PAT (a user identity) creates the PR: GITHUB_TOKEN is blocked by
          # the "Allow GitHub Actions to create and approve pull requests" setting.
          GH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          title=$(head -c 256 "$OUTPUT_DIR/pr_title.txt")
          # Sub-issues stay open through the chain; merging this PR is what closes
          # them, so every one of them needs its own `Closes` here.
          printf '\n\n%s\n' "${SUB_CLOSES:-}" >> "$OUTPUT_DIR/pr_description.txt"
          url=$(gh pr create --draft --base master --head "$BRANCH" \
            --title "$title" --body-file "$OUTPUT_DIR/pr_description.txt")
          echo "number=$(basename "$url")" >> "$GITHUB_OUTPUT"

      # --- Chain: next sub-issue (re-label PRD) or hand off to Review. ---
      - name: Re-check remaining sub-issues and chain
        if: steps.preflight.outputs.proceed == 'true'
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.existing_pr.outputs.number || steps.new_pr.outputs.number }}
          LABEL_SCRIPT_DIGEST: ${{ steps.label_script.outputs.digest }}
        run: |
          set -euo pipefail
          # Run the pre-session snapshot, never `scripts/afk-add-label.sh` from
          # the tree: this step holds the PAT and the agent session could have
          # rewritten the tree's copy. The digest comes from a step output the
          # session cannot write, so the comparison is what makes the copy
          # trustworthy. `tests/afk/checkout-credentials.test.ts` holds the rule.
          script="$RUNNER_TEMP/afk-add-label.sh"
          if [ "$(sha256sum "$script" | cut -d' ' -f1)" != "$LABEL_SCRIPT_DIGEST" ]; then
            echo "::error::$script does not match the digest taken before the agent session; refusing to run it with AGENT_PAT."
            exit 1
          fi

          # Remaining = open sub-issues without the implemented marker (same rule
          # as the preflight; the run just marked the one it did). Counting open
          # sub-issues alone would loop forever: nothing closes them until merge.
          remaining=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/sub_issues" \
            --jq '.[] | select(.state == "open") | .number' \
            | while read -r n; do
                bodies=$(GH_TOKEN="$GITHUB_TOKEN" gh issue view "$n" --json comments --jq '.comments[].body')
                case "$bodies" in
                  *"$IMPLEMENTED_MARKER"*) continue ;;
                esac
                echo "$n"
              done | wc -l)

          # PAT-or-fallback (§3.4) in the one place it lives (#1029): AGENT_PAT
          # first because only its events fire the `labeled` trigger the chain
          # rides on, `github.token` as the fallback that at least lands the
          # label, and an `::error::` naming the item before a non-zero exit when
          # both refuse. The chain stops there whatever we do; the only choice is
          # whether it stops loudly, and under `set -e` that exit is the step's.
          #
          # A PR and an issue are labelled the same way: they share the issues
          # namespace, which is the endpoint the script uses.
          if [ "$remaining" -gt 0 ]; then
            echo "$remaining sub-issue(s) remaining — re-firing the chain."
            "$script" "$ISSUE_NUMBER" "agent:implement" "the chain" \
              "the chain stops here."
          else
            echo "All sub-issues implemented — handing off to Review. They close when the PR merges."
            "$script" "$PR_NUMBER" "agent:review" "the chain" \
              "the chain stops here."
          fi

      # --- Failure: mark blocked + comment on BOTH the PRD and the sub-issue (§4.3). ---
      # `!= 'false'`, not `== 'true'`: a preflight that *itself* fails leaves
      # `proceed` unset, and `== 'true'` would swallow that — a red run with no
      # `agent:blocked` and no comment. Only a deliberate refusal (`false`) is silent.
      - name: On failure — block + comment
        if: failure() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SUB_NUMBER: ${{ steps.preflight.outputs.sub_number }}
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — before the label below
            # gets added. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          banked=""
          if [ -n "${BANKED_BRANCH:-}" ]; then
            banked=$(printf '\n\n**Partial work preserved** on the shared branch `%s`: green commits the agent added before the failure. A retry resumes this branch and continues the sub-issue from here.' "$BANKED_BRANCH")
          fi
          body=$(printf '`agent:implement` (PRD) run failed on sub-issue #%s.\n\n**Reason:** %s\n\n**Workflow run:** %s/%s/actions/runs/%s%s\n\nRemove `agent:blocked` and re-add `agent:implement` to the PRD to retry; the run recomputes the first sub-issue that is still open and unmarked.' "$SUB_NUMBER" "$reason" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" "$banked")
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked"
          gh issue comment "$ISSUE_NUMBER" --body "$body"
          gh issue comment "$SUB_NUMBER" --body "$body" || true

      - name: Always — remove in-progress from PRD
        if: always() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
