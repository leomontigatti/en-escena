# AFK — Implement PR (address feedback). Spec §4.5.
#
# PR labeled `agent:implement` → implement-pr runner acts on the unresolved
# conversation (changes code where warranted, replies where useful) → orchestrator
# pushes any commit (race-safe), posts thread replies + new inline comments +
# top-level comments. Hands back to a human — no automatic chaining.
#
# `pull_request_target` (not `pull_request`): the labeled event must fire even
# when the PR is out-of-date/conflicting, which has no test-merge commit (§3.3).

name: AFK Implement PR

# `dangerous-triggers` is ignored inline below rather than restructured: the
# same-repo guard on the job (#635) is the control, and it already refuses every
# run whose PR head branch is not in this repository.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — same-repo guard on the job, #635
    types: [labeled]

concurrency:
  # Shared with Review + Update Branch when this run will actually mutate the
  # branch: all three push to the PR branch, so they serialise (§3.5). A single
  # `labeled` event starts all three workflows; the two whose label doesn't
  # match are no-ops. If those no-ops also joined the shared group they would
  # cancel the pending real run (#383), so a no-op takes a unique per-run group
  # instead and contends with nobody.
  group: ${{ github.event.label.name == 'agent:implement' && format('agent-mutate-pr-{0}', github.event.pull_request.number) || format('agent-mutate-pr-noop-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  implement-pr:
    # Same-repo guard (#635). `pull_request_target` runs with this repo's secrets,
    # and the checkout below puts `head.sha` — the PR author's tree — on disk. On a
    # fork PR that is contributor-controlled code executing with `AGENT_PAT` in
    # reach. The label is a permission gate, not a provenance check, so it has to
    # be paired with one. It belongs at job level rather than in the preflight
    # below: the preflight reports its refusals, but it runs inside the job that
    # would go on to check the untrusted tree out.
    if: >-
      github.event.label.name == 'agent:implement' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # --- Preflight: refuse a closed/merged PR or one with nothing to act on (§4.5). ---
      - name: Preflight (refusals)
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        # The `github-env` ignore on the `run:` below: the only thing this step
        # writes to $GITHUB_ENV is the static "$RUNNER_TEMP/afk-output" path. No
        # issue or PR body reaches it, which is what the audit is looking for.
        run: | # zizmor: ignore[github-env]
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"

          state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$state" != "OPEN" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:implement"
            gh pr comment "$PR_NUMBER" --body "\`agent:implement\` ignored: the PR is not open (state: $state)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing to act on? Count top-level comments, non-empty review bodies,
          # and unresolved inline threads (§4.5).
          top_level=$(gh pr view "$PR_NUMBER" --json comments --jq '[.comments[] | select(.body != "")] | length')
          reviews=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --jq '[.[] | select(.body != "")] | length')
          unresolved=$(gh api graphql -f query='
            query ($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { isResolved } }
                }
              }
            }' -F owner="${GH_REPO%/*}" -F repo="${GH_REPO#*/}" -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')

          if [ "$((top_level + reviews + unresolved))" -eq 0 ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:implement"
            gh pr comment "$PR_NUMBER" --body "\`agent:implement\` ignored: nothing to act on (no comments, review summaries, or unresolved threads)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Transition to in-progress
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The two outcome labels come off as well (#1021): they classify the
          # review that has just been superseded, and a new feedback round leaves
          # the PR unclassified until the next Review run says otherwise.
          gh pr edit "$PR_NUMBER" \
            --remove-label "agent:implement" \
            --remove-label "agent:blocked" \
            --remove-label "agent:ready" \
            --remove-label "agent:needs-decision" \
            --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No credential in `.git/config`: the agent session reads PR text and
          # runs `pnpm install` scripts, so nothing it can reach may hold a token
          # (#956). The push step authenticates per command instead.
          persist-credentials: false

      - name: Prepare branch refs
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin master:master
          # Point the local branch at the checked-out head sha so the race-safe
          # push has a named branch to lease against.
          git checkout -B "$BRANCH" "$BRANCH_HEAD_SHA"

      - name: Setup pnpm
        if: steps.preflight.outputs.proceed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install deps + agent runner
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          pnpm install --frozen-lockfile
          # `--allow-build`: without it pnpm reports success but skips the CLI's
          # postinstall, and `claude` then fails at run time with "native binary not
          # installed". `--version` is the guard that turns that into an install-time
          # failure, and it logs the resolved `stable` version for the run.
          #
          # `--global-bin-dir "$PNPM_HOME"`: `pnpm/action-setup` puts `$PNPM_HOME` on
          # PATH but not pnpm's default global bin dir (`$PNPM_HOME/bin`), and pnpm
          # refuses a global add whose bin dir is not on PATH — a bare `pnpm add -g`
          # exits 1 here with "The configured global bin directory ... is not in PATH".
          # Installing into `$PNPM_HOME` itself is what puts `claude` on PATH for this
          # step *and* for the later runner step, which spawns a bare `claude`.
          if [ -z "${PNPM_HOME-}" ]; then
            echo "PNPM_HOME is unset: pnpm/action-setup must run before this step." >&2
            exit 1
          fi
          pnpm add -g --global-bin-dir "$PNPM_HOME" --allow-build=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
          claude --version

      - name: Configure git identity
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          # The agent session starts after this step: nothing may have stored a
          # credential in the tree (#956). `persist-credentials: false` on the
          # checkout is what makes this hold; the assertion keeps it honest.
          if git config --get-all http.https://github.com/.extraheader >/dev/null; then
            echo "A credential is persisted in .git/config; refusing to start the agent." >&2
            exit 1
          fi

      - name: Run implement-pr runner
        if: steps.preflight.outputs.proceed == 'true'
        timeout-minutes: 60 # guardrail: an agent hang must not burn the whole run
        env:
          # Read-only prefetch (`gh`) uses this. The runner calls
          # `revokeGitHubToken()` once the prefetch is done, so the agent itself
          # never sees it — `noSandbox()` would otherwise spread it into the
          # agent's environment (§3.9: the agent never mutates the tracker).
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Internal deadline, below the step's `timeout-minutes`: the runner aborts
          # the agent and fails with a real reason instead of being killed without
          # leaving one (#512).
          #
          # 50, not 25, like Implement and Implement PRD: a review round on a
          # whole-PRD PR outgrew 25 min twice on #1185 (#1186).
          AGENT_BUDGET_MINUTES: 50
        run: pnpm exec tsx .sandcastle/agent-implement-pr/implement-pr.mts

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: implement-pr-agent-log
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Race-safe push (if the agent committed)
        if: steps.preflight.outputs.proceed == 'true'
        env:
          # Explicit push credential, `AGENT_PAT` first so pushes that touch
          # `.github/workflows/**` carry the `workflow` scope, `github.token`
          # as the no-PAT fallback (docs/agents/afk-setup.md).
          PUSH_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
        run: |
          set -euo pipefail
          [ "$(cat "$OUTPUT_DIR/has_commits.txt" 2>/dev/null || echo false)" = "true" ] || {
            echo "No commit; nothing to push."
            exit 0
          }
          # Per-command auth (#956): the checkout persisted nothing, so this is the
          # one place a push credential exists — and only for this command.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          # `actions/checkout` masks the header it builds; this one is ours to mask.
          echo "::add-mask::$auth"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt; then
            cat push_err.txt >&2
            # A lost lease is the expected race. Anything else — a token without
            # the `workflow` scope, a network fault — used to leave the step green
            # with nothing pushed, because only the race patterns were matched.
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-pr run." > "$OUTPUT_DIR/failure_reason.txt"
            else
              echo "Push failed; git's output is in the step log." > "$OUTPUT_DIR/failure_reason.txt"
            fi
            exit 1
          fi

      - name: Post thread replies
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          replies="$OUTPUT_DIR/implement_thread_replies.json"
          [ -s "$replies" ] || { echo "No thread replies."; exit 0; }
          count=$(jq 'length' "$replies")
          for i in $(seq 0 $((count - 1))); do
            node_id=$(jq -r ".[$i].commentId" "$replies")
            body=$(jq -r ".[$i].body" "$replies")
            rest_id=$(gh api graphql \
              -f query='query($id:ID!){node(id:$id){... on PullRequestReviewComment{databaseId}}}' \
              -F id="$node_id" --jq '.data.node.databaseId')
            [ -n "$rest_id" ] || { echo "Skipping reply with unresolvable id $node_id"; continue; }
            gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/comments/$rest_id/replies" -f body="$body"
          done

      - name: Post new inline comments
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inline="$OUTPUT_DIR/implement_new_inline_comments.json"
          [ -s "$inline" ] || { echo "No new inline comments."; exit 0; }
          count=$(jq 'length' "$inline")
          for i in $(seq 0 $((count - 1))); do
            jq ".[$i]" "$inline" > inline_comment.json
            gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --input inline_comment.json
          done

      - name: Post top-level comments
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          top="$OUTPUT_DIR/implement_top_level_comments.json"
          [ -s "$top" ] || { echo "No top-level comments."; exit 0; }
          count=$(jq 'length' "$top")
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$top")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      # `!= 'false'`, not `== 'true'`: a preflight that *itself* fails leaves
      # `proceed` unset, and `== 'true'` would swallow that — a red run with no
      # `agent:blocked` and no comment. Only a deliberate refusal (`false`) is silent.
      - name: On failure — block + comment
        if: failure() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — before the label below
            # gets added. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked"
          gh pr comment "$PR_NUMBER" --body "$(printf '`agent:implement` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s/%s/actions/runs/%s\n\nRe-add `agent:implement` to retry.' "$reason" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")"

      - name: Always — remove in-progress
        if: always() && steps.preflight.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
