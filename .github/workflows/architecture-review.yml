# AFK — Architecture Review. Spec §4.8.
#
# Scheduled unattended pass: the architecture-review runner surveys the codebase
# read-only, picks ONE high-leverage deepening opportunity not already proposed,
# and emits it as a PRD-shaped structured output → orchestrator publishes it as an
# issue labeled `source:architecture-review`. A human then triages it, and a local
# session slices it into sub-issues with `to-tickets`. The agent creates nothing — the orchestrator is the sole
# publisher (§3.9).

name: AFK Architecture Review

on:
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC, Mondays
  workflow_dispatch: {}

concurrency:
  group: architecture-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  architecture-review:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set OUTPUT_DIR
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/afk-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/afk-output"

      - name: Checkout master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install deps + agent runner
        run: |
          pnpm install --frozen-lockfile
          # `--allow-build`: without it pnpm reports success but skips the CLI's
          # postinstall, and `claude` then fails at run time with "native binary not
          # installed". `--version` is the guard that turns that into an install-time
          # failure, and it logs the resolved `stable` version for the run.
          #
          # `--global-bin-dir "$PNPM_HOME"`: `pnpm/action-setup` puts `$PNPM_HOME` on
          # PATH but not pnpm's default global bin dir (`$PNPM_HOME/bin`), and pnpm
          # refuses a global add whose bin dir is not on PATH — a bare `pnpm add -g`
          # exits 1 here with "The configured global bin directory ... is not in PATH".
          # Installing into `$PNPM_HOME` itself is what puts `claude` on PATH for this
          # step *and* for the later runner step, which spawns a bare `claude`.
          if [ -z "${PNPM_HOME-}" ]; then
            echo "PNPM_HOME is unset: pnpm/action-setup must run before this step." >&2
            exit 1
          fi
          pnpm add -g --global-bin-dir "$PNPM_HOME" --allow-build=@anthropic-ai/claude-code @anthropic-ai/claude-code@stable
          claude --version

      - name: Run architecture-review runner
        timeout-minutes: 20 # spec §4.8 guardrail
        env:
          # Read-only prefetch of prior proposals uses this; the agent holds no token.
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Internal deadline, below the step's `timeout-minutes` (20, §4.8): the
          # runner aborts the agent and fails with a real reason instead of being
          # killed without leaving one (#512).
          AGENT_BUDGET_MINUTES: 15
        run: pnpm exec tsx .sandcastle/agent-architecture-review/architecture-review.mts

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-review-agent-log
          path: ${{ env.OUTPUT_DIR }}/*.agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish PRD (if proposed)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$OUTPUT_DIR/architecture_review_output.json"
          if [ ! -s "$out" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(jq -r '.status' "$out")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "proposed" ]; then
            exit 0
          fi
          # Idempotent — the label already exists (created in AFK setup #343).
          gh label create source:architecture-review --color 5319E7 \
            --description "PRD proposed by the scheduled architecture-review pass" 2>/dev/null || true
          title=$(head -c 256 "$OUTPUT_DIR/prd_title.txt")
          url=$(gh issue create --title "$title" \
            --body-file "$OUTPUT_DIR/prd_body.md" \
            --label source:architecture-review \
            --label needs-triage)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Through `env:`, never interpolated into the script: the title the agent
          # proposed ends up in the issue URL, so `steps.publish.outputs.*` is agent
          # text and must not be expanded into the shell (zizmor `template-injection`).
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
          PUBLISH_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          out="$OUTPUT_DIR/architecture_review_output.json"
          {
            echo "# Architecture Review"
            echo
            status="$PUBLISH_STATUS"
            case "$status" in
              proposed)
                echo "**Proposed a PRD:** $PUBLISH_URL"
                echo
                summary=$(jq -r '.oneLineSummary // ""' "$out" 2>/dev/null || echo "")
                [ -n "$summary" ] && echo "> $summary"
                echo
                echo "**Candidates considered:**"
                jq -r '.candidatesConsidered[]? | "- \(.)"' "$out" 2>/dev/null || true
                ;;
              skipped)
                echo "**Skipped** — no new PRD this run."
                echo
                reason=$(jq -r '.reason // ""' "$out" 2>/dev/null || echo "")
                [ -n "$reason" ] && echo "> $reason"
                ;;
              *)
                echo "**No output produced** — the agent likely crashed. See the failure reason below."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # This pass is scheduled, so there is no issue or PR to label and comment on
      # the way §3.7 prescribes for the label-triggered workflows: the run summary
      # is the only place a human will look. Same reason resolution as theirs.
      - name: On failure — report the reason in the run summary
        if: failure()
        run: |
          set -euo pipefail
          # No `failure_reason.txt` means `runMain`'s catch never ran: the step hit
          # its `timeout-minutes` and Actions killed the process tree (#512). The
          # agent log survives in OUTPUT_DIR, so fall back to its tail instead of
          # reporting a bare "(no reason file written)".
          reason=$(cat "$OUTPUT_DIR/failure_reason.txt" 2>/dev/null || true)
          if [ -z "$reason" ]; then
            # `head` closing the pipe can leave `sort` at SIGPIPE (141), which
            # `pipefail` would turn into an aborted step — losing the summary
            # below. Reporting must never hinge on this pipeline succeeding.
            log=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.agent.log' -printf '%T@ %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2- || true)
            if [ -n "${log:-}" ] && [ -s "$log" ]; then
              reason=$(printf 'no `failure_reason.txt` — last 30 lines of the agent log:\n\n```\n%s\n```' "$(tail -n 30 "$log")")
            else
              reason="(no reason file written — check workflow logs)"
            fi
          fi
          {
            echo
            printf '**Reason:** %s\n' "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
