# CI pipeline — implements the decision in #305 (full charter of the workflow).
# PR-only: issue -> branch -> PR -> merge. Three jobs, all meant to be required:
#   - checks   : lint / typecheck / non-DB tests / build, with no database (@/db is lazy, #308).
#   - db-gate  : full `*.db.test.ts` suite against real Postgres 17 (mirrors production).
#   - docs-gate: mapped code changed => its current-state document must change too (#630).
# Branch protection on `master` is live: direct pushes are forbidden and `checks` and
# `db-gate` are required contexts, with `strict: true`. Required contexts are a repo
# setting, not a file here, so adding a job does not make it binding — `docs-gate` has to
# be added to that list by hand once its first run has created the context.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: `check:fallow` attributes findings against the merge
          # base with `origin/master`, and a shallow clone has neither the ref
          # nor the history to attribute against.
          fetch-depth: 0
      - uses: pnpm/action-setup@v5 # version comes from the `packageManager` field (pnpm 11.9.0)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Hook mistakes and import cycles — the two bug classes `tsc` and Prettier
      # cannot see. Deliberately narrow; everything else is owned elsewhere.
      - run: pnpm lint
      - run: pnpm check:repo-styles
      - run: pnpm check:file-tokens
      # Retired dependencies stay retired (#582): removing a package from the
      # manifest does not keep it out, and typecheck has no opinion once it is
      # re-added. The rule carries its own reason and prints it on failure.
      - run: pnpm check:banned-imports
      # Engineering prose stays English (#592). The sweep took the tree to zero
      # Spanish comments and test names; this is what keeps it there, since the
      # rule had been living in CODING_STANDARDS alone and losing every review
      # to "the file around it is already Spanish".
      - run: pnpm check:comment-language
      # Fallow, on the `new-only` gate: dead code, complexity and duplication
      # the branch *introduces* fail; what it merely touches is reported and
      # inherited. This reverses the older decision that Fallow was audit-only
      # (docs/agents/fallow.md) — an audit nobody is obliged to run had been
      # filing its findings as issues after the fact instead of before.
      # No `git fetch` here: `fetch-depth: 0` above already brought the history
      # the merge base is computed from.
      - name: fallow audit (findings this branch introduces)
        run: pnpm check:fallow
      # Drift-check (deferred from #391): `db:generate` is offline (it diffs
      # `schema.ts` against the snapshots in `app/db/migrations/meta/`, no DB)
      # and must report "No schema changes". If it emits a migration, `schema.ts`
      # drifted from the versioned baseline and was left uncommitted → fail.
      # The fix goes in `schema.ts` plus a regenerated baseline, never by
      # editing the .sql.
      - name: drift-check (db:generate leaves no uncommitted migration)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain app/db/migrations)" ]; then
            echo "::error::Schema drift: db:generate produced an uncommitted migration. Fix schema.ts and regenerate the baseline (see docs/db/migrations.md)."
            git status --porcelain app/db/migrations
            git --no-pager diff -- app/db/migrations
            exit 1
          fi
      # Two rules about migrations, both invisible to `db-gate` because a fresh
      # database applies anything in folder order; scripts/migrations/journal.mjs
      # explains both. Ordering (#593): a migration not newer than every one
      # already on master merges green and then never runs in production, and the
      # fix is a rebase plus `pnpm db:generate`. Immutability (the deploy #762
      # broke, restored in #774): Drizzle hashes the whole .sql file, so editing
      # even a comment in an applied migration makes the container refuse to
      # start. One step, because both need the same fetch.
      - name: migration-order and immutability (vs. master)
        run: |
          git fetch --no-tags --depth=1 origin master
          pnpm check:migration-order
          pnpm check:migration-immutability
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  # Its own job rather than a step inside `checks`: with this gate the *message*
  # is the point, and inside `checks` a doc-gate failure is visually identical to
  # a lint failure and gets buried in a long log. Checkout plus `node`, no
  # install — the extra runner costs seconds. Full history because the check
  # needs the merge base and the PR's commit messages (the escape-hatch trailer).
  docs-gate:
    name: docs-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: docs-gate (mapped code changes must touch their current-state doc)
        run: |
          git fetch --no-tags origin master
          node scripts/check-doc-map.mjs origin/master

  db-gate:
    name: db-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine # mirrors production
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: en-escena-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The local default is 5433; in CI the service maps to 5432.
      # `tests/db/config.ts` honours this env var, and `db:test:reset` passes it
      # through to drizzle-kit as DATABASE_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/en-escena-test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Resets and applies the versioned schema (the #305/#391 path), then runs
      # the whole DB suite against a real Postgres.
      - run: pnpm test:db:postgres
