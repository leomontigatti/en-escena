# CI pipeline — implements the decision in #305 (full charter of the workflow).
# PR-only: issue -> branch -> PR -> merge. Four gates, all meant to be required:
#   - checks   : secrets scan / lint / typecheck / non-DB tests / build, with no
#                database (@/db is lazy, #308). The secrets scan is gitleaks over the
#                PR's own commits (#978); `.husky/pre-commit` is its local half.
#   - db-gate  : full `*.db.test.ts` suite against real Postgres 17 (mirrors production),
#                split across the `db-shard` matrix (#962). Each shard is a runner with its
#                own Postgres service, so no shard shares a database with another and the
#                serial-within-a-runner isolation model of ADR-0007 is unchanged. `db-gate`
#                itself runs no tests: it is the aggregator that fails unless every shard
#                succeeded, and it exists so the required-context name stays stable.
#   - docs-gate: mapped code changed => its current-state document must change too (#630).
#   - actions-gate: zizmor + actionlint over every workflow in this directory (#955).
# Branch protection on `master` is live: direct pushes are forbidden and `checks`,
# `db-gate`, `docs-gate` and `actions-gate` are required contexts, with `strict: true`. Required contexts
# are a repo setting, not a file here, so renaming or adding a job does not update them —
# that is a human step outside the repo.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Every job here only reads the repository: no job comments, labels or pushes.
# Declared at the top level so each job inherits it and none silently gets the
# default write-all token (zizmor `excessive-permissions`).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: `check:fallow` attributes findings against the merge
          # base with `origin/master`, and a shallow clone has neither the ref
          # nor the history to attribute against.
          fetch-depth: 0
          persist-credentials: false
      # Secrets gate (#978), first because nothing else matters if the branch
      # carries a credential. The rules are in `.gitleaks.toml`, which gitleaks
      # picks up from the repository root; `.husky/pre-commit` runs the same scan
      # over the staged diff, warning instead of failing when the binary is absent.
      # Here it is blocking, and the binary is pinned the same way actionlint is in
      # `actions-gate` — an exactly-pinned release fetched inline, no Marketplace
      # action to keep fresh — but by checksum as well as by version, because there
      # is no official install script to delegate that to. Not `gitleaks-action`,
      # which would open a second PR-comment channel next to the job log.
      # Scope is `origin/master..HEAD`: the PR's own commits. History before the
      # merge base is master's problem, and rescanning it on every PR would turn
      # any pre-existing finding into a permanently red gate.
      - name: gitleaks (secrets in this PR's commits)
        env:
          # Bumping this means bumping the checksum with it: the two are one pin.
          # `gitleaks_<version>_checksums.txt` on the release page is the source.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `fetch-depth: 0` brings the history but not necessarily the
          # `origin/master` remote-tracking ref the log range is written against.
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          /tmp/gitleaks git --no-banner --redact --verbose --log-opts="origin/master..HEAD"
      # The pnpm version comes from the `packageManager` field (pnpm 11.9.0)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Hook mistakes and import cycles — the two bug classes `tsc` and Prettier
      # cannot see. Deliberately narrow; everything else is owned elsewhere.
      - run: pnpm lint
      - run: pnpm check:repo-styles
      - run: pnpm check:file-tokens
      # Retired dependencies stay retired (#582): removing a package from the
      # manifest does not keep it out, and typecheck has no opinion once it is
      # re-added. The rule carries its own reason and prints it on failure.
      - run: pnpm check:banned-imports
      # Engineering prose stays English (#592). The sweep took the tree to zero
      # Spanish comments and test names; this is what keeps it there, since the
      # rule had been living in CODING_STANDARDS alone and losing every review
      # to "the file around it is already Spanish".
      - run: pnpm check:comment-language
      # Fallow, on the `new-only` gate: dead code, complexity and duplication
      # the branch *introduces* fail; what it merely touches is reported and
      # inherited. This reverses the older decision that Fallow was audit-only
      # (docs/agents/fallow.md) — an audit nobody is obliged to run had been
      # filing its findings as issues after the fact instead of before.
      # No `git fetch` here: `fetch-depth: 0` above already brought the history
      # the merge base is computed from.
      - name: fallow audit (findings this branch introduces)
        run: pnpm check:fallow
      # Drift-check (deferred from #391): `db:generate` is offline (it diffs
      # `schema.ts` against the snapshots in `app/db/migrations/meta/`, no DB)
      # and must report "No schema changes". If it emits a migration, `schema.ts`
      # drifted from the versioned baseline and was left uncommitted → fail.
      # The fix goes in `schema.ts` plus a regenerated baseline, never by
      # editing the .sql.
      - name: drift-check (db:generate leaves no uncommitted migration)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain app/db/migrations)" ]; then
            echo "::error::Schema drift: db:generate produced an uncommitted migration. Fix schema.ts and regenerate the baseline (see docs/db/migrations.md)."
            git status --porcelain app/db/migrations
            git --no-pager diff -- app/db/migrations
            exit 1
          fi
      # Three rules about migrations, all invisible to `db-gate` because a fresh
      # database applies anything in folder order against no running code;
      # scripts/migrations/journal.mjs explains the first two. Ordering (#593): a
      # migration not newer than every one already on master merges green and then
      # never runs in production, and the fix is a rebase plus `pnpm db:generate`.
      # Immutability (the deploy #762 broke, restored in #774): Drizzle hashes the
      # whole .sql file, so editing even a comment in an applied migration makes
      # the container refuse to start. Safety (#998): squawk over the .sql files
      # the branch *adds* — a drop or a rename breaks the old container, which
      # Coolify keeps serving while the new one migrates, and lock hazards warn.
      # One step, because all three need the same fetch.
      - name: migration-order, immutability and safety (vs. master)
        run: |
          git fetch --no-tags --depth=1 origin master
          pnpm check:migration-order
          pnpm check:migration-immutability
          pnpm check:migration-safety
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  # The Actions security gate (#955): every workflow in `.github/workflows/` goes
  # through zizmor (posture: pin freshness, trigger safety, permissions, template
  # injection) and actionlint (syntax, expressions, shellcheck over `run:` blocks).
  # No `paths:` filter — like the other three it has to report on every PR to be a
  # required context, and it is seconds of runner time.
  # Online audits are on deliberately. `known-vulnerable-actions`, `impostor-commit`
  # and `ref-version-mismatch` only exist with a token, and they are how the SHA pins
  # stay honest without a bot opening update PRs: a pin that goes stale or points at
  # something that is no longer the tag it claims turns the gate red. `github.token`
  # is read-only here (see the top-level `permissions:`) and is used for nothing else.
  # Both tools are version-pinned; bumping them is a manual edit, documented in
  # docs/agents/workflows.md alongside the `pinact run --update` pin bump.
  # No pinact in CI: zizmor's `unpinned-uses` already fails on anything not SHA-pinned.
  actions-gate:
    name: actions-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: zizmor (Actions security posture, pin freshness)
        env:
          # Online audits; read-only, and scoped to this run.
          GH_TOKEN: ${{ github.token }}
        # `pipx run`, not `uvx`: `uv` is not on the `ubuntu-latest` image and `uvx`
        # would exit 127 before auditing anything, while `pipx` is preinstalled. Same
        # shape either way — an ephemeral, exactly-pinned install with no setup action.
        run: pipx run zizmor==1.30.1 --config .github/zizmor.yml --format plain .github/workflows/
      - name: actionlint (workflow syntax and expressions)
        env:
          # actionlint runs shellcheck over every `run:` block. Only `warning` and
          # above is actionable here: at `info`/`style` the gate is a wall of SC2016
          # ("expressions don't expand in single quotes") pointing at correct `jq '...'`
          # filters, which would train everyone to stop reading the job.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          # The official download script, pinned to the release it installs — not the
          # Marketplace action, which would be one more third-party pin to keep fresh.
          curl -fsSL -o /tmp/download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12 /tmp
          /tmp/actionlint -color

  # Its own job rather than a step inside `checks`: with this gate the *message*
  # is the point, and inside `checks` a doc-gate failure is visually identical to
  # a lint failure and gets buried in a long log. Checkout plus `node`, no
  # install — the extra runner costs seconds. Full history because the check
  # needs the merge base and the PR's commit messages (the escape-hatch trailer).
  docs-gate:
    name: docs-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: docs-gate (mapped code changes must touch their current-state doc)
        run: |
          git fetch --no-tags origin master
          node scripts/check-doc-map.mjs origin/master

  # Sharded by file with vitest's `--shard` (#962). `vitest.db.config.ts` stays serial
  # (`fileParallelism: false`, `maxWorkers: 1`): that constraint is about sharing one
  # database inside a runner, and each matrix job gets its own service container. Shards
  # are whole files, so a file never straddles two databases.
  # Shard count: each shard pays ~35 s of fixed setup (container init, checkout, install),
  # so the target is 1-2 min of tests per shard. 4 is the starting guess, timed on one
  # shard locally; the #962 amendment in docs/agents/test-suite-speed-plan.md records what
  # was measured and what has to be re-read off this PR's own CI run.
  db-shard:
    name: db-shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: a red `db-gate` should report every
      # failure in the suite, not just the first shard to hit one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # mirrors production
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: en-escena-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The local default is 5433; in CI the service maps to 5432.
      # `tests/db/config.ts` honours this env var, and `db:test:reset` passes it
      # through to drizzle-kit as DATABASE_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/en-escena-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Resets and applies the versioned schema (the #305/#391 path) against this shard's
      # own service container, then runs this shard's slice of the DB suite. Spelled out
      # rather than reusing `pnpm test:db:postgres` because only CI passes `--shard`.
      - name: db suite (shard ${{ matrix.shard }} of 4)
        run: pnpm db:test:reset && pnpm exec vitest --config vitest.db.config.ts --run --shard=${{ matrix.shard }}/4

  # The required status check. Named exactly `db-gate` because branch protection on
  # `master` requires that context by name; the tests themselves moved to `db-shard`.
  # No checkout and no install — it only reads the matrix result.
  db-gate:
    name: db-gate
    runs-on: ubuntu-latest
    needs: [db-shard]
    # Without `always()` a failed shard leaves this job skipped, and a skipped required
    # context never reports, so branch protection would wait on it forever. The cost is
    # that a cancelled run also publishes a red `db-gate`; that is the run being
    # superseded, and protection reads the newest one.
    if: always()
    steps:
      - name: every DB shard succeeded
        run: |
          if [ "${{ needs.db-shard.result }}" != "success" ]; then
            echo "::error::db-gate: the db-shard matrix reported '${{ needs.db-shard.result }}'. See the failing shard job for the tests."
            exit 1
          fi
          echo "All DB shards succeeded."
