# AFK — Promote Queued. Spec §4.7.
#
# When an issue closes, promote any `agent:queued` issue that declared it as a
# blocker — but only once ALL that dependent's blockers have cleared — by
# flipping it to `agent:implement`. The exit ramp from the queued state: humans
# apply `agent:queued`, this workflow removes it.
#
# A `not planned` close still promotes nothing (spec §4.7), but it no longer does
# so silently: the first step comments on the queued dependents it declines to
# promote. Local addition on top of the spec — see
# docs/agents/afk-vendored-assets.md.
#
# No agent, no concurrency group (§4.7): parallel runs are made safe by the
# idempotent re-fetch-before-mutate in the promote step.

name: AFK Promote Queued

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      CLOSED_NUMBER: ${{ github.event.issue.number }}
    steps:
      # The promote step runs `scripts/afk-add-label.sh` (#1029), so the repo has
      # to be on disk. An `issues` event checks out the default branch, never a
      # contributor's tree, and nothing here needs history.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Per-command auth (#956): every `gh` call below is handed exactly the
          # token it needs, so no credential belongs in `.git/config`.
          persist-credentials: false

      # A not-planned close unblocks nothing — deliberately (a decision that was
      # deferred or rejected did not deliver what the dependent waits for). But
      # under the closure convention (docs/agents/issue-tracker.md) that is now
      # the normal way to close a *deferred* issue, so the dependents would sit in
      # `agent:queued` forever with nothing said. Say it: no promotion, one
      # comment, and the follow-up issue has to be declared as the new blocker.
      - name: Announce a not-planned close to its queued dependents
        if: github.event.issue.state_reason == 'not_planned'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          deps=$(GH_TOKEN="$GITHUB_TOKEN" gh api graphql -f query='
            query ($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) {
                  blocking(first: 100) { nodes { number state } }
                }
              }
            }' -F owner="$owner" -F repo="$repo" -F num="$CLOSED_NUMBER" \
            --jq '.data.repository.issue.blocking.nodes[] | select(.state == "OPEN") | .number' 2>/dev/null || echo "")

          if [ -z "$deps" ]; then
            echo "No open dependents blocking on #$CLOSED_NUMBER."
            exit 0
          fi

          for Y in $deps; do
            queued=$(GH_TOKEN="$GITHUB_TOKEN" gh issue view "$Y" --json labels \
              --jq '[.labels[].name] | index("agent:queued") // empty')
            if [ -z "$queued" ]; then
              echo "#$Y not labeled agent:queued — nothing to announce."
              continue
            fi
            GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$Y" --body "#$CLOSED_NUMBER closed as \`not planned\`, so it did **not** unblock this issue: it stays \`agent:queued\`. If the work moved to a follow-up issue, declare that one as the blocker here; otherwise drop the blocker and re-dispatch by hand. See \`docs/agents/issue-tracker.md\` → Closing an issue."
            echo "Announced the non-promotion on #$Y."
          done

      # Unchanged gate: a wontfix/not-planned close unblocks nothing.
      - name: Promote unblocked dependents
        if: github.event.issue.state_reason != 'not_planned'
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          # 1. Dependents of the closed issue: issues that declared it as a blocker.
          deps=$(GH_TOKEN="$GITHUB_TOKEN" gh api graphql -f query='
            query ($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $num) {
                  blocking(first: 100) { nodes { number state } }
                }
              }
            }' -F owner="$owner" -F repo="$repo" -F num="$CLOSED_NUMBER" \
            --jq '.data.repository.issue.blocking.nodes[] | select(.state == "OPEN") | .number' 2>/dev/null || echo "")

          if [ -z "$deps" ]; then
            echo "No open dependents blocking on #$CLOSED_NUMBER."
            exit 0
          fi

          unpromoted=""
          for Y in $deps; do
            info=$(GH_TOKEN="$GITHUB_TOKEN" gh api graphql -f query='
              query ($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $num) {
                    labels(first: 50) { nodes { name } }
                    parent { number }
                    blockedBy(first: 100) { nodes { number state } }
                  }
                }
              }' -F owner="$owner" -F repo="$repo" -F num="$Y")

            labels=$(echo "$info" | jq -r '.data.repository.issue.labels.nodes[].name')
            parent=$(echo "$info" | jq -r '.data.repository.issue.parent.number // empty')
            open_blockers=$(echo "$info" | jq '[.data.repository.issue.blockedBy.nodes[] | select(.state == "OPEN")] | length')

            if ! echo "$labels" | grep -qx "agent:queued"; then
              echo "#$Y not labeled agent:queued — skip."
              continue
            fi
            if echo "$labels" | grep -qx "agent:in-progress"; then
              echo "#$Y is agent:in-progress — skip."
              continue
            fi
            if [ -n "$parent" ]; then
              echo "#$Y is a sub-issue of #$parent — refusing to promote."
              GH_TOKEN="$GITHUB_TOKEN" gh issue edit "$Y" --remove-label "agent:queued" --add-label "agent:blocked"
              GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$Y" --body "This is a sub-issue of #$parent; label the parent PRD \`agent:implement\` instead of queueing the sub-issue."
              continue
            fi
            if [ "$open_blockers" -gt 0 ]; then
              echo "#$Y still has $open_blockers open blocker(s) — skip (GitHub UI shows them)."
              continue
            fi

            # 3. Idempotent flip: re-fetch labels; a sibling run may have won.
            still_queued=$(GH_TOKEN="$GITHUB_TOKEN" gh issue view "$Y" --json labels \
              --jq '[.labels[].name] | index("agent:queued") // empty')
            if [ -z "$still_queued" ]; then
              echo "#$Y no longer agent:queued (a sibling run won) — skip."
              continue
            fi

            GH_TOKEN="$GITHUB_TOKEN" gh issue edit "$Y" --remove-label "agent:queued"
            GH_TOKEN="$GITHUB_TOKEN" gh issue comment "$Y" --body "Unblocked by #$CLOSED_NUMBER closing — promoting to \`agent:implement\`."

            # PAT-or-fallback (§3.4), in the one place it lives: the script
            # tries AGENT_PAT — the only token whose events wake Implement —
            # falls back to `github.token`, and names a wholly refused add with
            # `::error::` before exiting non-zero (#1029).
            #
            # Accumulate and carry on: `agent:queued` is already off this issue,
            # so a refused add leaves it carrying neither label, but that costs
            # only itself. The rest of the list is still promotable, and the job
            # exits non-zero at the end with every stranded issue named.
            if ! scripts/afk-add-label.sh "$Y" "agent:implement" "Implement" \
              "it is now unlabelled and will not start."; then
              unpromoted="$unpromoted $Y"
              continue
            fi

            echo "Promoted #$Y to agent:implement."
          done

          if [ -n "$unpromoted" ]; then
            echo "Could not promote:$unpromoted"
            exit 1
          fi
